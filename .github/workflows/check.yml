name: skill-and-example-checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install PDF extraction dependency for tests
        run: python -m pip install PyMuPDF==1.28.0

      - name: Test portable paper tools
        run: python -m unittest discover -s tests -v

      - name: Check skill resources and pinned runtime
        run: python math-paper-writing/scripts/check_skill_resources.py
      - name: Check public examples
        run: python examples/check_examples.py
